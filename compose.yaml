services:
  postgres:
    image: postgres:17
    container_name: istad-micro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: istad_micro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - istad_micro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d istad_micro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  istad_micro_postgres_data:
